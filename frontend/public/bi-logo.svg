<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <radialGradient id="goldRim" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#fff4c2"/>
      <stop offset="35%" stop-color="#dfaa2c"/>
      <stop offset="70%" stop-color="#b8841a"/>
      <stop offset="100%" stop-color="#734f07"/>
    </radialGradient>
    <radialGradient id="sunburstGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5b8"/>
      <stop offset="50%" stop-color="#f5c234"/>
      <stop offset="100%" stop-color="#c98a12"/>
    </radialGradient>
    <linearGradient id="shieldBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003da5"/>
      <stop offset="100%" stop-color="#001a52"/>
    </linearGradient>
    <linearGradient id="shieldRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d61f26"/>
      <stop offset="100%" stop-color="#8a0c10"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3d07"/>
      <stop offset="100%" stop-color="#2a1c02"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>

    <!-- Text paths for circular typography -->
    <path id="topTextArc" d="M 68 250 A 182 182 0 0 1 432 250" fill="none"/>
    <path id="bottomTextArc" d="M 418 250 A 168 168 0 0 1 82 250" fill="none"/>
  </defs>

  <!-- Outer Beaded / Gold Rim -->
  <circle cx="250" cy="250" r="242" fill="url(#goldRim)" filter="url(#subtleShadow)"/>
  <circle cx="250" cy="250" r="236" fill="#fdfcf7" stroke="#9a7114" stroke-width="2"/>
  <circle cx="250" cy="250" r="232" fill="#fffef8" stroke="#d4ab3a" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Inner Band for Text -->
  <circle cx="250" cy="250" r="226" fill="#fcfaf2" stroke="#b0861d" stroke-width="3"/>
  <circle cx="250" cy="250" r="148" fill="url(#sunburstGrad)" stroke="#b0861d" stroke-width="4"/>

  <!-- Star Rays / Sunburst background behind shield -->
  <g opacity="0.45" stroke="#a06e0a" stroke-width="1.5">
    <line x1="250" y1="102" x2="250" y2="398"/>
    <line x1="102" y1="250" x2="398" y2="250"/>
    <line x1="145" y1="145" x2="355" y2="355"/>
    <line x1="145" y1="355" x2="355" y2="145"/>
    <line x1="196" y1="109" x2="304" y2="391"/>
    <line x1="304" y1="109" x2="196" y2="391"/>
    <line x1="109" y1="196" x2="391" y2="304"/>
    <line x1="109" y1="304" x2="391" y2="196"/>
  </g>

  <!-- Airplane Icon at Top -->
  <g transform="translate(250, 48) scale(0.9)" fill="#8c620e" stroke="#5c3f05" stroke-width="0.5">
    <path d="M 0 -12 L 3 -3 L 18 3 L 18 6 L 3 4 L 3 11 L 8 14 L 8 17 L 0 15 L -8 17 L -8 14 L -3 11 L -3 4 L -18 6 L -18 3 L -3 -3 Z"/>
  </g>

  <!-- Ship / Steamer Vessel Icon at Bottom -->
  <g transform="translate(250, 442) scale(0.95)" fill="#8c620e" stroke="#5c3f05" stroke-width="0.5">
    <path d="M -18 2 L 18 2 L 13 10 L -13 10 Z"/>
    <rect x="-10" y="-3" width="20" height="5" rx="1"/>
    <rect x="-6" y="-7" width="4" height="4"/>
    <rect x="2" y="-7" width="4" height="4"/>
    <path d="M -22 11 Q -15 9 -8 11 Q 0 13 8 11 Q 15 9 22 11" fill="none" stroke="#8c620e" stroke-width="1.5"/>
  </g>

  <!-- Circular Text: BUREAU OF IMMIGRATION -->
  <text font-family="'Cinzel', 'Times New Roman', 'Georgia', serif" font-weight="900" font-size="25" fill="url(#goldText)" letter-spacing="4.5">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      BUREAU OF IMMIGRATION
    </textPath>
  </text>

  <!-- Circular Text: DEPARTMENT OF JUSTICE -->
  <text font-family="'Cinzel', 'Times New Roman', 'Georgia', serif" font-weight="800" font-size="18.5" fill="url(#goldText)" letter-spacing="3.5">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      DEPARTMENT OF JUSTICE
    </textPath>
  </text>

  <!-- Laurel Wreath around Shield -->
  <g fill="#d99f18" stroke="#8c6209" stroke-width="0.5" opacity="0.85">
    <!-- Left Wreath -->
    <path d="M 160 250 C 158 200 180 160 205 140 C 200 148 190 165 188 190 C 182 180 172 185 174 200 C 170 215 168 230 170 250 C 165 240 156 245 158 260 C 160 280 170 310 195 335 C 185 325 175 305 170 285 C 162 280 158 290 160 298 Z"/>
    <!-- Right Wreath -->
    <path d="M 340 250 C 342 200 320 160 295 140 C 300 148 310 165 312 190 C 318 180 328 185 326 200 C 330 215 332 230 330 250 C 335 240 344 245 342 260 C 340 280 330 310 305 335 C 315 325 325 305 330 285 C 338 280 342 290 340 298 Z"/>
  </g>

  <!-- Philippine Coat of Arms Shield -->
  <g transform="translate(250, 240) scale(1.02)" filter="url(#subtleShadow)">
    <path d="M -60 -75 L 60 -75 Q 65 10 58 40 Q 48 72 0 95 Q -48 72 -58 40 Q -65 10 -60 -75 Z"
          fill="#fdfaf0" stroke="#a07212" stroke-width="4"/>

    <!-- Chief -->
    <path d="M -58 -73 L 58 -73 L 58 -25 L -58 -25 Z" fill="#ffffff" stroke="#a07212" stroke-width="1.5"/>

    <!-- Left Field - Blue -->
    <path d="M -58 -25 L 0 -25 L 0 92 Q -46 70 -56 38 Q -60 10 -58 -25 Z"
          fill="url(#shieldBlue)" stroke="#a07212" stroke-width="1.5"/>

    <!-- Right Field - Red -->
    <path d="M 0 -25 L 58 -25 Q 60 10 56 38 Q 46 70 0 92 Z"
          fill="url(#shieldRed)" stroke="#a07212" stroke-width="1.5"/>

    <!-- Gold Center Oval for Sun -->
    <ellipse cx="0" cy="-25" rx="30" ry="24" fill="url(#sunburstGrad)" stroke="#9a6e0e" stroke-width="2"/>

    <!-- Philippine Sun -->
    <g transform="translate(0, -25)" fill="#fce444" stroke="#875b05" stroke-width="0.6">
      <circle cx="0" cy="0" r="10" fill="#ffdd2b"/>
      <path d="M -2 -10 L 0 -20 L 2 -10 Z"/>
      <path d="M -2 10 L 0 20 L 2 10 Z"/>
      <path d="M -10 -2 L -20 0 L -10 2 Z"/>
      <path d="M 10 -2 L 20 0 L 10 2 Z"/>
      <path d="M -7 -7 L -14 -14 L -5 -9 Z"/>
      <path d="M 7 -7 L 14 -14 L 5 -9 Z"/>
      <path d="M -7 7 L -14 14 L -5 9 Z"/>
      <path d="M 7 7 L 14 14 L 5 9 Z"/>
    </g>

    <!-- 3 Stars -->
    <polygon points="-38,-48 -35,-40 -27,-40 -33,-35 -31,-27 -38,-31 -45,-27 -43,-35 -49,-40 -41,-40" fill="#ffd429" stroke="#9a710f" stroke-width="0.5" transform="scale(0.8) translate(-10,-10)"/>
    <polygon points="0,-64 3,-56 11,-56 5,-51 7,-43 0,-47 -7,-43 -5,-51 -11,-56 -3,-56" fill="#ffd429" stroke="#9a710f" stroke-width="0.5" transform="scale(0.8) translate(0,-12)"/>
    <polygon points="38,-48 41,-40 49,-40 43,-35 45,-27 38,-31 31,-27 33,-35 27,-40 35,-40" fill="#ffd429" stroke="#9a710f" stroke-width="0.5" transform="scale(0.8) translate(10,-10)"/>

    <!-- Left Shield Emblem (Eagle) -->
    <g transform="translate(-28, 25) scale(0.55)" fill="#ffd952" stroke="#875b05" stroke-width="0.6">
      <path d="M 0 -15 C -8 -10 -18 -5 -22 8 C -15 5 -10 2 0 5 C 10 2 15 5 22 8 C 18 -5 8 -10 0 -15 Z"/>
      <path d="M -4 5 L -10 25 L 0 20 L 10 25 L 4 5 Z"/>
      <circle cx="0" cy="-17" r="4"/>
    </g>

    <!-- Right Shield Emblem (Lion Rampant) -->
    <g transform="translate(28, 25) scale(0.52)" fill="#ffd952" stroke="#875b05" stroke-width="0.6">
      <path d="M -5 20 L 0 24 L 5 20 L 3 10 L 8 4 L 14 6 L 10 -2 L 14 -10 L 6 -8 L 4 -16 L -2 -14 L -6 -8 L -2 -4 L -8 2 L -4 10 Z"/>
    </g>

    <!-- Scroll Ribbon at Bottom -->
    <g transform="translate(0, 84)">
      <path d="M -65 0 Q 0 -6 65 0 L 68 12 Q 0 6 -68 12 Z" fill="#fdfbf4" stroke="#8c6209" stroke-width="1.2"/>
      <path d="M -68 12 L -78 6 L -65 0 Z" fill="#d9c79e" stroke="#8c6209" stroke-width="1"/>
      <path d="M 68 12 L 78 6 L 65 0 Z" fill="#d9c79e" stroke="#8c6209" stroke-width="1"/>
      <text font-family="'Cinzel', 'Arial', sans-serif" font-weight="bold" font-size="5" fill="#382604" text-anchor="middle" y="7.5" letter-spacing="0.5">
        REPUBLIC OF THE PHILIPPINES
      </text>
    </g>
  </g>
</svg>
