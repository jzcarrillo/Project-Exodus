<svg xmlns="http://www.w3.org/2000/svg" width="280" height="420" viewBox="0 0 280 420">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#223f60" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#14263b" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="g2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b3450" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0e1b2b" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a4d75" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#182d45" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="g4" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1e3855" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#102033" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background base -->
  <rect width="280" height="420" fill="#102033"/>

  <!-- Layered Diamond & Chevron Facets -->
  <!-- Row 0 -->
  <polygon points="140,-70 280,35 140,140 0,35" fill="url(#g1)"/>
  <polygon points="0,-70 140,35 0,140 -140,35" fill="url(#g2)"/>
  <polygon points="280,-70 420,35 280,140 140,35" fill="url(#g3)"/>

  <!-- Row 1 -->
  <polygon points="70,70 210,175 70,280 -70,175" fill="url(#g3)"/>
  <polygon points="210,70 350,175 210,280 70,175" fill="url(#g4)"/>
  <polygon points="-70,70 70,175 -70,280 -210,175" fill="url(#g1)"/>

  <!-- Row 2 -->
  <polygon points="140,210 280,315 140,420 0,315" fill="url(#g2)"/>
  <polygon points="0,210 140,315 0,420 -140,315" fill="url(#g1)"/>
  <polygon points="280,210 420,315 280,420 140,315" fill="url(#g4)"/>

  <!-- Row 3 -->
  <polygon points="70,350 210,455 70,560 -70,455" fill="url(#g4)"/>
  <polygon points="210,350 350,455 210,560 70,455" fill="url(#g3)"/>
  <polygon points="-70,350 70,455 -70,560 -210,455" fill="url(#g2)"/>

  <!-- Subtle overlay diagonal lighting -->
  <polygon points="0,0 280,210 280,420 0,210" fill="#2d527c" opacity="0.08"/>
  <polygon points="0,210 280,420 280,630 0,420" fill="#0b1624" opacity="0.15"/>
</svg>
