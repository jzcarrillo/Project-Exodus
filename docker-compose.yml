services:
  # 1. DynamoDB Local (Amazon Official Image)
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: exodus-dynamodb-local
    user: root
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    working_dir: /home/dynamodblocal

  # 2. Automated DynamoDB Tables Initializer
  init-dynamodb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: exodus-init-dynamodb
    depends_on:
      - dynamodb-local
    environment:
      - AWS_REGION=ap-southeast-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - DYNAMODB_TABLE_PREFIX=BI_
    command: ["node", "scripts/setup-aws-resources.mjs"]
    restart: "no"

  # 3. NestJS Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: exodus-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      - dynamodb-local
      - init-dynamodb
    environment:
      - PORT=4000
      - NODE_ENV=development
      - DB_PROVIDER=dynamodb
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - DYNAMODB_TABLE_PREFIX=BI_
      - AWS_REGION=ap-southeast-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - STORAGE_PROVIDER=local
      - BI_REVIEWER_EMAILS=reviewer@bi.gov.ph,officer@bi.gov.ph
    volumes:
      - backend-uploads:/app/uploads
      - backend-data:/app/data

  # 4. React / Next.js / Vinext Frontend Portal
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: exodus-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - PORT=5173
      - HOST=0.0.0.0
      - BACKEND_URL=http://backend:4000
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  dynamodb-data:
  backend-uploads:
  backend-data:
