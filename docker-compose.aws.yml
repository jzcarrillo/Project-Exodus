version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: exodus-backend-aws
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DB_PROVIDER=dynamodb
      - DYNAMODB_TABLE_PREFIX=${DYNAMODB_TABLE_PREFIX:-bi-}
      - STORAGE_PROVIDER=s3
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-bi-eservices-documents}
      - AWS_REGION=${AWS_REGION:-ap-southeast-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - BI_REVIEWER_EMAILS=${BI_REVIEWER_EMAILS:-reviewer@bi.gov.ph,officer@bi.gov.ph}
      - AUTH_PROVIDER=${AUTH_PROVIDER:-cognito}
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID}
      - COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID}
      - COGNITO_REGION=${COGNITO_REGION:-${AWS_REGION:-ap-southeast-1}}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: exodus-frontend-aws
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - PORT=5173
      - HOST=0.0.0.0
      - BACKEND_URL=http://backend:4000
